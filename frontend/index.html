<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern URL Shortener</title>
  <meta name="description" content="Create short, memorable, and trackable links with instant real-time analytics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Background Decorative Shapes -->
  <div class="blob-mint" aria-hidden="true">
    <svg width="220" height="220" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M42.7,-64C54.9,-54.6,64.2,-42.2,69.7,-28.4C75.3,-14.6,77.1,0.6,73.4,14.6C69.7,28.6,60.6,41.4,48.9,51.8C37.2,62.2,22.9,70.2,7.2,71.5C-8.5,72.7,-25.6,67.3,-39.8,57.7C-54,48.1,-65.2,34.3,-70.6,18.4C-76,2.5,-75.6,-15.5,-67.9,-29.4C-60.2,-43.3,-45.2,-53.1,-30.9,-61.6C-16.6,-70.1,-3,-77.3,10.2,-75.5C23.4,-73.7,30.5,-73.4,42.7,-64Z"
        transform="translate(100 100)" fill="#D3EBEA" />
      <!-- squiggles -->
      <path d="M70 70 Q 75 60 85 70" stroke="#71A8A4" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M120 50 Q 125 40 135 50" stroke="#71A8A4" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M90 120 Q 95 110 105 120" stroke="#71A8A4" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M50 110 Q 55 100 65 110" stroke="#71A8A4" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </svg>
  </div>

  <div class="blob-yellow" aria-hidden="true">
    <svg width="180" height="180" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M47.7,-61.4C61.4,-53.9,71.8,-39.2,75.9,-23C80,-6.7,77.7,11.2,70.6,26.4C63.5,41.6,51.6,54.1,37.3,62.8C23,71.5,6.3,76.4,-10.8,74.7C-27.9,73,-45.4,64.7,-57.4,51.6C-69.4,38.5,-75.9,20.6,-76.3,2.7C-76.7,-15.2,-71,-33.1,-59.4,-44.6C-47.8,-56.1,-30.3,-61.2,-13.9,-62.7C2.5,-64.2,34,-68.9,47.7,-61.4Z"
        transform="translate(100 100)" fill="#FCEAC7" />
      <!-- dots & marks -->
      <path d="M80 80 Q 85 75 90 80" stroke="#E3C488" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M130 90 Q 135 85 140 90" stroke="#E3C488" stroke-width="2" stroke-linecap="round" fill="none" />
      <circle cx="110" cy="65" r="2.5" fill="#E3C488" />
      <circle cx="95" cy="120" r="2.5" fill="#E3C488" />
    </svg>
  </div>

  <div class="app-container">
    <!-- Navigation Bar -->
    <header class="navbar">
      <div class="brand">
        <span class="brand-text">URL Shortener</span>
      </div>



    </header>

    <!-- Main Hero Section -->
    <main class="hero-section">
      <div class="hero-title-container">
        <h1 class="hero-title">
          Create Your<br />
          <span class="badge-short">Short</span> Link
        </h1>
      </div>

      <!-- Shorten Input Form Container -->
      <div class="input-card">
        <form id="shortenForm" class="shorten-form">
          <div class="input-wrapper">
            <span class="link-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </span>
            <input type="url" id="originalUrlInput" class="url-input" placeholder="Paste long url to shorten it"
              required autocomplete="off" />
          </div>

          <div class="form-actions">
            <select id="expirySelect" class="expiry-select" title="Link Expiration">
              <option value="2">Expires in 2 days</option>
              <option value="7">Expires in 7 days</option>
              <option value="30">Expires in 30 days</option>
              <option value="never">Never expires</option>
            </select>

            <button type="submit" id="shortenBtn" class="btn-shorten">
              <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2v6h-6"></path>
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                <path d="M3 22v-6h6"></path>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
              </svg>
              <span class="btn-text">Shorten</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Featured / Just Created Card (Dynamically displayed when created) -->
      <section id="featuredCardContainer" class="featured-card-wrapper hidden"></section>
    </main>

    <!-- Dashboard & Stats Section (Mint green bottom half) -->
    <section class="dashboard-section">
      <!-- 4 Top KPI Cards -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon-circle icon-coral">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </div>
          <div class="kpi-info">
            <span class="kpi-value" id="kpiTotalLinks">0</span>
            <span class="kpi-label">Total Links</span>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon-circle icon-orange">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
              <path d="M13 13l6 6"></path>
            </svg>
          </div>
          <div class="kpi-info">
            <span class="kpi-value" id="kpiTotalClicks">0</span>
            <span class="kpi-label">Total Clicks</span>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon-circle icon-red">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <line x1="12" y1="14" x2="12" y2="18"></line>
              <line x1="10" y1="16" x2="14" y2="16"></line>
            </svg>
          </div>
          <div class="kpi-info">
            <span class="kpi-value" id="kpiAddedMonth">0</span>
            <span class="kpi-label">Added This Month</span>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon-circle icon-brown">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
              </path>
            </svg>
          </div>
          <div class="kpi-info">
            <span class="kpi-value" id="kpiActiveLinks">0</span>
            <span class="kpi-label">Active Links</span>
          </div>
        </div>
      </div>

      <!-- Links List Section -->
      <div class="links-list-container">
        <div class="list-header">
          <h2 class="list-title">Your Shortened Links</h2>
          <button id="refreshStatsBtn" class="btn-refresh" title="Refresh all stats">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Sync Stats
          </button>
        </div>

        <div id="linksList" class="links-list">
          <!-- Dynamic link items rendered via app.js -->
        </div>

        <div id="emptyState" class="empty-state hidden">
          <p>No links shortened yet. Enter a URL above to create your first short link!</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Statistics Modal Dialog -->
  <dialog id="statsDialog" class="stats-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Link Analytics</h3>
        <button id="closeModalBtn" class="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body" id="modalStatsContent">
        <div class="modal-spinner">Loading analytics...</div>
      </div>
    </div>
  </dialog>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>

</html>
